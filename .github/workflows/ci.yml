name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,live,dashboard]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t streamguard:ci .
      - run: docker build -t streamguard-dashboard:ci -f dashboard/Dockerfile .
      - run: docker compose config -q

  integration:
    # Full end-to-end test against the real stack (Redpanda + TimescaleDB).
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,dashboard]"
      - run: docker compose up -d --build redpanda timescaledb processor
      - run: RUN_INTEGRATION=1 pytest -m integration -o addopts="" -v
      - if: failure()
        run: docker compose logs --no-color
